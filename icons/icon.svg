<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b10" />
      <stop offset="100%" stop-color="#070709" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="50%" stop-color="#F5C518" />
      <stop offset="100%" stop-color="#C29603" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85" />
  <!-- Clapperboard Top -->
  <g transform="translate(256, 175) rotate(-6) translate(-256, -175)">
    <rect x="130" y="145" width="252" height="42" rx="6" fill="#141418" stroke="url(#goldGrad)" stroke-width="4" />
    <path d="M155,145 L175,187 M205,145 L225,187 M255,145 L275,187 M305,145 L325,187 M355,145 L375,187" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
  </g>
  <!-- Clapperboard Body -->
  <rect x="130" y="200" width="252" height="185" rx="10" fill="#111116" stroke="url(#goldGrad)" stroke-width="5" />
  <!-- Play Icon -->
  <polygon points="230,250 310,295 230,340" fill="url(#goldGrad)" />
  <!-- Film Strip Accents -->
  <rect x="145" y="220" width="16" height="20" rx="3" fill="url(#goldGrad)" opacity="0.8" />
  <rect x="145" y="260" width="16" height="20" rx="3" fill="url(#goldGrad)" opacity="0.8" />
  <rect x="145" y="300" width="16" height="20" rx="3" fill="url(#goldGrad)" opacity="0.8" />
  <rect x="145" y="340" width="16" height="20" rx="3" fill="url(#goldGrad)" opacity="0.8" />
  <rect x="351" y="220" width="16" height="20" rx="3" fill="url(#goldGrad)" opacity="0.8" />
  <rect x="351" y="260" width="16" height="20" rx="3" fill="url(#goldGrad)" opacity="0.8" />
  <rect x="351" y="300" width="16" height="20" rx="3" fill="url(#goldGrad)" opacity="0.8" />
  <rect x="351" y="340" width="16" height="20" rx="3" fill="url(#goldGrad)" opacity="0.8" />
  <!-- Boğaziçi Text / Stars -->
  <circle cx="230" cy="220" r="5" fill="url(#goldGrad)" />
  <circle cx="282" cy="220" r="5" fill="url(#goldGrad)" />
</svg>